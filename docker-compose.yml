version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aiflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - radai_network

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiflow_backend
    command: bash start.sh
    volumes:
      - .:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - FINANCE_RICHA_EMAIL=${FINANCE_RICHA_EMAIL}
      - FINANCE_JARMO_EMAIL=${FINANCE_JARMO_EMAIL}
      - FINANCE_ALEKSI_EMAIL=${FINANCE_ALEKSI_EMAIL}
      - FINANCE_MO_EMAIL=${FINANCE_MO_EMAIL}
      - FINANCE_ANEEF_EMAIL=${FINANCE_ANEEF_EMAIL}
      - FINANCE_SHERWIN_EMAIL=${FINANCE_SHERWIN_EMAIL}
      - FINANCE_NIJUM_EMAIL=${FINANCE_NIJUM_EMAIL}
      - FINANCE_HR_ADMIN_EMAIL=${FINANCE_HR_ADMIN_EMAIL}
      - FINANCE_JAMAL_EMAIL=${FINANCE_JAMAL_EMAIL}
      - FINANCE_RAFAT_EMAIL=${FINANCE_RAFAT_EMAIL}
      - FINANCE_BILLING_EMAIL=${FINANCE_BILLING_EMAIL}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - radai_network

volumes:
  media_files:
  static_files:

networks:
  radai_network:
    driver: bridge

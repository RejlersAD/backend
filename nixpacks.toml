[phases.setup]
# Core system packages - lightweight (no ML packages)
nixPkgs = [
    'python311',
    'postgresql',
    'tesseract',  # Tesseract OCR binary for P&ID processing
    'poppler_utils',  # For PDF processing (pdf2image)
    'libGL',  # Required for image processing
    'glib'  # Required for image processing
]

[phases.install]
cmds = [
    'python -m venv /opt/venv',
    '. /opt/venv/bin/activate && pip install --upgrade pip',
    '# Use Railway-optimized requirements (excludes 4GB of ML packages)',
    '. /opt/venv/bin/activate && pip install -r requirements-railway.txt',
    '# Verify tesseract installation',
    'which tesseract || echo "❌ Tesseract not found"',
    'tesseract --version || echo "❌ Tesseract version check failed"'
]

[phases.build]
cmds = [
    '. /opt/venv/bin/activate && python manage.py collectstatic --noinput || echo "Static files collection skipped"',
    '# Make startup scripts executable (if they exist)',
    'chmod +x railway_start.sh 2>/dev/null || echo "railway_start.sh not found or already executable"',
    'chmod +x start.sh 2>/dev/null || echo "start.sh not found or already executable"'
]

[start]
cmd = 'bash railway_start.sh'

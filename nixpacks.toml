[phases.setup]
# System packages for P&ID/PFD AI analysis (OCR, PDF, image processing)
nixPkgs = [
    'python311',
    'postgresql',
    'tesseract',       # Tesseract OCR for P&ID processing
    'poppler_utils',   # PDF processing (pdf2image)
    'libGL',           # Image/CV processing
    'glib'             # Image processing
]

[phases.install]
# onlyIncludeFiles tells nixpacks to explicitly COPY these files into
# the install stage before running cmds - fixes "requirements.txt not found"
# when custom cmds bypass nixpacks' automatic Python file-staging.
onlyIncludeFiles = ['requirements.txt']
cmds = [
    'python -m venv /opt/venv',
    '. /opt/venv/bin/activate && pip install --upgrade pip',
    '. /opt/venv/bin/activate && pip install -r /app/requirements.txt'
]

[phases.build]
cmds = [
    'which tesseract && tesseract --version 2>&1 | head -1 || echo "WARNING: Tesseract not found"',
    '. /opt/venv/bin/activate && python manage.py collectstatic --noinput || echo "Collectstatic skipped"'
]

[start]
# railway_start.sh: activates venv, runs migrations, starts gunicorn
cmd = 'bash railway_start.sh'

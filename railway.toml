[build]
builder = "nixpacks"

[deploy]
# Files are executable in git repo (100755 permissions)
# No chmod needed - scripts can run directly
# Run migrations automatically on every deployment to ensure DB is up to date
# SOFT-CODED: WSGI path read from config/wsgi.py (Django default structure)
startCommand = "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

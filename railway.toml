# ============================================
# RAILWAY DEPLOYMENT - Backend Service
# ============================================
# Build Context: backend/ directory (git repository root)
# Dockerfile: Dockerfile (single-stage production build)
# Pre-deploy: apply migrations before the new container starts
# Start: Gunicorn begins listening immediately after pre-deploy succeeds
# Health Check: /api/v1/health/ (should pass within 15 seconds)
# ============================================

[build]
  builder = "dockerfile"
  dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["python manage.py migrate --noinput"]
healthcheckPath = "/api/v1/health/"
healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10

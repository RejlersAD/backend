# ============================================
# RAILWAY DEPLOYMENT - Backend Service
# ============================================
# Build Context: backend/ directory (git repository root)
# Dockerfile: Dockerfile (single-stage production build)
# Start Command: railway_start_fast.sh (health-first mode)
#   - Starts Gunicorn immediately for fast health checks
#   - Runs migrations in background after service is healthy
# Health Check: /api/v1/health/ (should pass within 15 seconds)
# ============================================

[build]
  builder = "dockerfile"
  dockerfilePath = "Dockerfile"

[deploy]
  healthcheckPath = "/api/v1/health/"
  healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10

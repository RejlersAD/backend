# ============================================
# RAILWAY DEPLOYMENT - Backend Service
# ============================================
# Build Context: backend/ directory (git repository root)
# Dockerfile: Dockerfile (single-stage production build)
# Startup: apply the planning schema, then start Gunicorn
# Health Check: /api/v1/health/ (should pass within 15 seconds)
# ============================================

[build]
  builder = "dockerfile"
  dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health/"
healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10

# ============================================
# RAILWAY DEPLOYMENT - Backend Service
# ============================================
# Build Context: backend/ directory (git repository root)
# Dockerfile: Dockerfile (single-stage production build)
# Startup: apply the planning schema, then start Gunicorn
# Health Check: /api/v1/health/ (should pass within 15 seconds)
# ============================================

[build]
  builder = "dockerfile"
  dockerfilePath = "Dockerfile"

[deploy]
  # Run the complete schema upgrade before Railway starts or health-checks
  # the web container. A non-zero exit keeps the previous release online.
  preDeployCommand = ["python manage.py migrate --noinput --skip-checks"]
  healthcheckPath = "/api/v1/health/"
  healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10

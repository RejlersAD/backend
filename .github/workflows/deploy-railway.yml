# ============================================================================
# RAILWAY AUTO-DEPLOYMENT - Backend Service
# ============================================================================
# Triggers: Push to main branch, manual workflow dispatch
# Purpose: Automatically deploy backend to Railway on code changes
# Database: Soft-coded via Railway environment variables
# ============================================================================

name: Deploy Backend to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'config/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'gunicorn_config.py'
      - 'manage.py'
      - 'railway.toml'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preprod
          - staging

env:
  # Soft-coded deployment configuration
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

jobs:
  # ============================================================================
  # JOB 1: CODE QUALITY & VALIDATION
  # ============================================================================
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run linting (flake8)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
        
      - name: Check for security issues
        run: |
          pip install bandit
          bandit -r apps/ -ll
        continue-on-error: true

  # ============================================================================
  # JOB 2: BUILD & DEPLOY TO RAILWAY
  # ============================================================================
  deploy:
    name: Deploy to Railway (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          
      - name: Deploy to Railway
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --service backend --environment ${{ env.DEPLOY_ENVIRONMENT }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          
      - name: Wait for deployment health check
        run: |
          echo "⏳ Waiting for Railway deployment to become healthy..."
          sleep 30
          
      - name: Verify deployment
        run: |
          echo "✅ Deployment triggered successfully"
          echo "📊 Environment: ${{ env.DEPLOY_ENVIRONMENT }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

  # ============================================================================
  # JOB 3: POST-DEPLOYMENT VALIDATION
  # ============================================================================
  verify:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Check health endpoint
        run: |
          HEALTH_URL="${{ secrets.RAILWAY_BACKEND_URL }}/api/v1/health/"
          echo "🏥 Checking health endpoint: $HEALTH_URL"
          
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "⏳ Attempt $i/10: HTTP $STATUS - Waiting 10s..."
            sleep 10
          done
          
          echo "❌ Health check failed after 10 attempts"
          exit 1
        continue-on-error: true

  # ============================================================================
  # JOB 4: NOTIFICATION
  # ============================================================================
  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: always()
    
    steps:
      - name: Deployment Summary
        run: |
          echo "📦 Backend Deployment Summary"
          echo "=============================="
          echo "Environment: ${{ env.DEPLOY_ENVIRONMENT }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Status: ${{ job.status }}"
          echo "=============================="

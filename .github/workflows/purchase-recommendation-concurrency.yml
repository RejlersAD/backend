name: Purchase Recommendation Concurrency

# Always report this stable check on PRs, including documentation-only changes.
# Path filters would leave a future required check pending on excluded PRs.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  procurement-postgresql:
    name: Purchase Recommendation Concurrency (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: radai_pr_concurrency
          POSTGRES_USER: radai_pr_concurrency
          POSTGRES_PASSWORD: synthetic-tests-only
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U radai_pr_concurrency -d radai_pr_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --tmpfs /var/lib/postgresql/data:rw

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      RADAI_CONCURRENCY_PG_PORT: '15439'
      RADAI_CONCURRENCY_PG_PASSWORD: synthetic-tests-only

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-procurement-ci.txt

      - name: Prepare test logs
        run: mkdir -p artifacts/pr-concurrency

      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-procurement-ci.txt 2>&1 | tee artifacts/pr-concurrency/dependencies.log

      - name: Check CI failure gates
        run: |
          set -euo pipefail
          python -m unittest config.test_procurement_ci_runner -v \
            2>&1 | tee artifacts/pr-concurrency/runner-controls.log

      - name: Verify PostgreSQL concurrency
        run: |
          set -euo pipefail
          python manage.py test \
            apps.procurement.tests.test_pr_save_submit_api \
            apps.procurement.tests.test_requisition_concurrency_postgresql \
            --settings=config.settings_procurement_postgresql_test \
            --testrunner=config.procurement_ci_runner.PurchaseRecommendationCIRunner \
            --noinput --verbosity 2 \
            2>&1 | tee artifacts/pr-concurrency/tests.log

      - name: Collect PostgreSQL logs
        if: always()
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p artifacts/pr-concurrency
          if ! docker logs "$POSTGRES_SERVICE_ID" > artifacts/pr-concurrency/postgresql.log 2>&1; then
            echo "::warning::Could not collect PostgreSQL service logs; inspect the service startup logs."
          fi

      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-recommendation-concurrency-logs
          path: |
            artifacts/pr-concurrency/dependencies.log
            artifacts/pr-concurrency/runner-controls.log
            artifacts/pr-concurrency/tests.log
            artifacts/pr-concurrency/postgresql.log
          if-no-files-found: warn
          retention-days: 7
